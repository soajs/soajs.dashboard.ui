name: Release

on:
  push:
    branches:
      - release
      - 'release/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Extract version from package.json
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          MAJOR_VERSION=$(echo ${PACKAGE_VERSION} | awk -F. '{ print $1 }')
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "MAJOR_VERSION=${MAJOR_VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: ${PACKAGE_VERSION}"
          echo "Major version: ${MAJOR_VERSION}"

      - name: Check the built console is present
        run: |
          test -f index.html
          test -d static/js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push consoleui
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            soajsorg/consoleui:latest
            soajsorg/consoleui:${{ steps.version.outputs.PACKAGE_VERSION }}
            soajsorg/consoleui:${{ steps.version.outputs.MAJOR_VERSION }}.x

      - name: Build and push consoleui-nossl
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile_nossl
          platforms: linux/amd64
          push: true
          tags: |
            soajsorg/consoleui-nossl:latest
            soajsorg/consoleui-nossl:${{ steps.version.outputs.PACKAGE_VERSION }}
            soajsorg/consoleui-nossl:${{ steps.version.outputs.MAJOR_VERSION }}.x

      - name: Create Git tag
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.PACKAGE_VERSION }} || true

      - name: Push tag
        run: git push origin ${{ steps.version.outputs.PACKAGE_VERSION }} || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.PACKAGE_VERSION }}
          name: Release ${{ steps.version.outputs.PACKAGE_VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
